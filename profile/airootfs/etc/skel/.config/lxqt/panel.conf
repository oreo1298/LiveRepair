[General]
__userfile__=true
panels=panel1

[panel1]
plugins=fancymenu,quicklaunch,taskbar,statusnotifier,tray,mount,worldclock,showdesktop
position=Bottom
desktop=0
panelSize=36
iconSize=24

[fancymenu]
type=fancymenu
alignment=Left
filterClear=true
autoSel=true
autoSelDelay=150

[quicklaunch]
type=quicklaunch
alignment=Left
apps\size=12
apps\1\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\2\desktop=/usr/share/applications/qterminal.desktop
apps\3\desktop=/usr/share/applications/firefox.desktop
apps\4\desktop=/usr/share/applications/liverepair-network.desktop
apps\5\desktop=/usr/share/applications/io.github.oreo1298.CloneAndRecover.desktop
apps\6\desktop=/usr/share/applications/io.github.oreo1298.RecoverAll.desktop
apps\7\desktop=/usr/share/applications/io.github.oreo1298.DiskHealth.desktop
apps\8\desktop=/usr/share/applications/io.github.oreo1298.TM5Linux.desktop
apps\9\desktop=/usr/share/applications/io.github.oreo1298.FastCopyLinux.desktop
apps\10\desktop=/usr/share/applications/io.github.oreo1298.LinBurn.desktop
apps\11\desktop=/usr/share/applications/io.github.oreo1298.Rufux.desktop
apps\12\desktop=/usr/share/applications/io.github.oreo1298.VirtConvert.desktop

[taskbar]
type=taskbar
buttonWidth=220
closeOnMiddleClick=true
groupingEnabled=false

[mount]
type=mount

[worldclock]
type=worldclock

[showdesktop]
alignment=Right
type=showdesktop

[statusnotifier]
alignment=Right
type=statusnotifier

[tray]
type=tray
