[System]
IconThemeName=breeze
FallbackIconThemeName=breeze
SuCommand=lxsudo dbus-run-session -- %s
Terminal=qterminal
SIUnit=false

[Behavior]
UseTrash=true
SingleClick=false
ConfirmDelete=true
QuickExec=true

# The wallpaper of the Arch-Colors theme (lxqt-themes)
[Desktop]
DesktopShortcuts=Home, Computer, Trash
WallpaperMode=zoom
Wallpaper=/usr/share/lxqt/wallpapers/plasma_arch.png
BgColor=#16202b
FgColor=#ffffff
ShadowColor=#000000
ShowHidden=false
SortOrder=ascending
SortColumn=name

# A repair system must not touch disks on its own: no automatic mounting.
[Volume]
MountOnStartup=false
MountRemovable=false
AutoRun=false
