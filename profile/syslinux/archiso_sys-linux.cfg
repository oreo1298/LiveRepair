LABEL liverepair
TEXT HELP
Start LiveRepair on BIOS.
Disk cloning, recovery, health checks, image burning and bootable USB tools.
ENDTEXT
MENU LABEL LiveRepair (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50%

LABEL liverepairsafe
TEXT HELP
Start LiveRepair on BIOS without kernel mode setting.
Use this if the screen stays black or garbled with the first entry.
ENDTEXT
MENU LABEL LiveRepair (%ARCH%, BIOS) with ^safe graphics
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50% nomodeset
