name: Build ISO

# Builds the ISO and boot-tests it in QEMU from an emulated DVD drive (UEFI and BIOS) on every
# push and pull request, or on demand (Actions > Build ISO > Run workflow). Nothing is published:
# the ISO and the test screenshots are kept as the run's artifacts for a few days.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Build the ISO (Arch Linux container)
        run: scripts/build-in-docker.sh

      - name: Show the result
        run: |
          ls -l out
          cat out/*-apps.txt

      - uses: actions/upload-artifact@v6
        with:
          name: liverepair-iso
          path: |
            out/*.iso
            out/*.sha256
            out/*.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  test:
    name: Boot test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: liverepair-iso
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf socat

      - name: Boot the ISO from a DVD drive (UEFI and BIOS) and run its self-test
        run: scripts/qemu-test.sh out/liverepair-*-x86_64.iso test-results

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: boot-test-results
          path: test-results
          retention-days: 14
